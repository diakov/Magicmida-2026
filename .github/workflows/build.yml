      - name: Build FPC 3.3.1 from source
        shell: powershell
        run: |
          $bootstrap = "C:\lazarus\fpc\3.2.2\bin\x86_64-win64\fpc.exe"
          $make = "C:\lazarus\fpc\3.2.2\bin\x86_64-win64\make.exe"

          if (-not (Test-Path $bootstrap)) {
            throw "Bootstrap FPC 3.2.2 not found"
          }

          if (-not (Test-Path $make)) {
            throw "make.exe not found"
          }

          $src = "$env:RUNNER_TEMP\fpcsrc"
          $install = "$env:RUNNER_TEMP\fpc331"

          git clone --depth 1 https://github.com/fpc/FPCSource.git $src

          New-Item -ItemType Directory -Force -Path $install | Out-Null

          Push-Location $src

          & $make `
            clean all install `
            FPC="$bootstrap" `
            INSTALL_PREFIX="$install"

          if ($LASTEXITCODE -ne 0) {
            Pop-Location
            exit $LASTEXITCODE
          }

          Pop-Location

          Write-Host "Searching installed compiler..."

          $compiler = Get-ChildItem $install `
            -Filter fpc.exe `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $compiler) {
            $compiler = Get-ChildItem $install `
              -Filter ppcx64.exe `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if (-not $compiler) {
            Get-ChildItem $install -Recurse | Select-Object FullName
            throw "Built FPC compiler not found"
          }

          echo "FPC331=$($compiler.FullName)" >> $env:GITHUB_ENV

          Write-Host "Compiler:"
          Write-Host $compiler.FullName
