name: Build Magicmida x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Magicmida
        uses: actions/checkout@v5

      - name: Install bootstrap Lazarus/FPC
        shell: powershell
        run: |
          choco install lazarus -y

      - name: Build FPC 3.3.1
        shell: powershell
        run: |
          $bootstrap = "C:\lazarus\fpc\3.2.2\bin\x86_64-win64\fpc.exe"
          $make = "C:\lazarus\fpc\3.2.2\bin\x86_64-win64\make.exe"

          $src = "$env:RUNNER_TEMP\fpcsrc"
          $install = "$env:RUNNER_TEMP\fpc331"

          if (-not (Test-Path $bootstrap)) {
            throw "Bootstrap FPC 3.2.2 not found"
          }

          if (-not (Test-Path $make)) {
            throw "Bootstrap make.exe not found"
          }

          git clone --depth 1 https://github.com/fpc/FPCSource.git $src

          New-Item -ItemType Directory -Force -Path $install | Out-Null

          Push-Location $src

          & $make `
            clean all install `
            FPC="$bootstrap" `
            INSTALL_PREFIX="$install"

          if ($LASTEXITCODE -ne 0) {
            Pop-Location
            exit $LASTEXITCODE
          }

          Pop-Location

          $compiler = Get-ChildItem $install `
            -Filter fpc.exe `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $compiler) {
            throw "FPC 3.3.1 not found"
          }

          echo "FPC331=$($compiler.FullName)" >> $env:GITHUB_ENV
          echo "FPC331BIN=$($compiler.Directory.FullName)" >> $env:GITHUB_ENV
          echo "FPC331ROOT=$install" >> $env:GITHUB_ENV

          # Make FPC 3.3.1 visible to lazbuild and subsequent steps
          echo "$($compiler.Directory.FullName)" >> $env:GITHUB_PATH

      - name: Configure FPC 3.3.1
        shell: powershell
        run: |
          $cfg = Join-Path "$env:FPC331BIN" "fpc.cfg"

          @"
          -Fu$env:FPC331ROOT\units\x86_64-win64\rtl
          -Fu$env:FPC331ROOT\units\x86_64-win64\*
          "@ | Set-Content -Path $cfg -Encoding ASCII

      - name: Verify FPC 3.3.1
        shell: powershell
        run: |
          where.exe fpc

          Write-Host "Version:"
          fpc.exe -iV

          Write-Host "CPU:"
          fpc.exe -iTP

          Write-Host "OS:"
          fpc.exe -iTO

      - name: Get current Lazarus source
        shell: powershell
        run: |
          $lazsrc = "$env:RUNNER_TEMP\lazarus-main"

          git clone --depth 1 https://github.com/fpc/Lazarus.git $lazsrc

          echo "LAZSRC=$lazsrc" >> $env:GITHUB_ENV

      - name: Build Lazarus with FPC 3.3.1
        shell: powershell
        run: |
          $make = "C:\lazarus\fpc\3.2.2\bin\x86_64-win64\make.exe"

          Write-Host "Compiler visible to Lazarus:"
          where.exe fpc

          Write-Host "FPC version:"
          fpc.exe -iV

          Push-Location "$env:LAZSRC"

          & $make `
            clean all `
            FPC="$env:FPC331" `
            PP="$env:FPC331" `
            CPU_TARGET=x86_64 `
            OS_TARGET=win64 `
            LCL_PLATFORM=win32

          if ($LASTEXITCODE -ne 0) {
            Pop-Location
            exit $LASTEXITCODE
          }

          Pop-Location

      - name: Build Magicmida x64
        shell: powershell
        run: |
          $lazbuild = Join-Path "$env:LAZSRC" "lazbuild.exe"

          if (-not (Test-Path $lazbuild)) {
            throw "lazbuild.exe not found"
          }

          & $lazbuild `
            "Magicmida.lpi" `
            --build-mode=Win64 `
            --compiler="$env:FPC331"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload Magicmida
        uses: actions/upload-artifact@v4
        with:
          name: Magicmida-2026-x64
          path: |
            **/Magicmida.exe
          if-no-files-found: error
