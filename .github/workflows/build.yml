name: Build Magicmida x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Lazarus
        shell: powershell
        run: |
          choco install lazarus -y

      - name: Download FPC 3.3.1 snapshot
        shell: powershell
        run: |
          $url = "https://downloads.freepascal.org/fpc/snapshot/trunk/x86_64-win64/fpc-3.3.1.x86_64-win64.built.on.i386-win32.zip"
          $zip = "$env:RUNNER_TEMP\fpc331.zip"
          $dst = "$env:RUNNER_TEMP\fpc331"

          Invoke-WebRequest -Uri $url -OutFile $zip

          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dst -Force

          Write-Host "Snapshot extracted to:"
          Write-Host $dst

      - name: Locate FPC 3.3.1
        shell: powershell
        run: |
          $root = "$env:RUNNER_TEMP\fpc331"

          Write-Host "Searching compiler executables..."

          Get-ChildItem $root -Recurse -Include fpc.exe,ppcx64.exe |
            Select-Object FullName

          $compiler = Get-ChildItem $root -Filter fpc.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $compiler) {
            $compiler = Get-ChildItem $root -Filter ppcx64.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if (-not $compiler) {
            throw "Neither fpc.exe nor ppcx64.exe was found"
          }

          Write-Host "Selected compiler:"
          Write-Host $compiler.FullName

          echo "FPC331=$($compiler.FullName)" >> $env:GITHUB_ENV

      - name: Verify FPC 3.3.1
        shell: powershell
        run: |
          Write-Host "Compiler:"
          Write-Host "$env:FPC331"

          Write-Host "Version:"
          & "$env:FPC331" -iV

          Write-Host "CPU:"
          & "$env:FPC331" -iTP

          Write-Host "OS:"
          & "$env:FPC331" -iTO

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Configure Lazarus
        shell: powershell
        run: |
          $lazbuild = "C:\lazarus\lazbuild.exe"

          if (-not (Test-Path $lazbuild)) {
            throw "lazbuild.exe not found"
          }

          echo "LAZBUILD=$lazbuild" >> $env:GITHUB_ENV

      - name: Build Magicmida x64
        shell: powershell
        run: |
          Write-Host "Using:"
          Write-Host "$env:FPC331"

          & "$env:LAZBUILD" `
            "Magicmida.lpi" `
            --build-mode=Win64 `
            --compiler="$env:FPC331"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Show generated EXE files
        shell: powershell
        run: |
          Get-ChildItem -Path . -Filter *.exe -Recurse |
            Select-Object FullName, Length

      - name: Upload Magicmida
        uses: actions/upload-artifact@v4
        with:
          name: Magicmida-2026-x64
          path: |
            **/Magicmida.exe
          if-no-files-found: error
