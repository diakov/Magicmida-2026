name: Build Magicmida x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Lazarus
        shell: powershell
        run: |
          choco install lazarus -y

      - name: Build FPC 3.3.1
        shell: powershell
        run: |
          $bootstrap = "C:\lazarus\fpc\3.2.2\bin\x86_64-win64\fpc.exe"
          $make = "C:\lazarus\fpc\3.2.2\bin\x86_64-win64\make.exe"
          $src = "$env:RUNNER_TEMP\fpcsrc"
          $install = "$env:RUNNER_TEMP\fpc331"

          git clone --depth 1 https://github.com/fpc/FPCSource.git $src

          New-Item -ItemType Directory -Force -Path $install | Out-Null

          Push-Location $src

          & $make `
            clean all install `
            FPC="$bootstrap" `
            INSTALL_PREFIX="$install"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          Pop-Location

          $compiler = Get-ChildItem $install `
            -Filter fpc.exe `
            -Recurse |
            Select-Object -First 1

          if (-not $compiler) {
            throw "FPC 3.3.1 not found"
          }

          echo "FPC331=$($compiler.FullName)" >> $env:GITHUB_ENV
          echo "$($compiler.Directory.FullName)" >> $env:GITHUB_PATH

      - name: Rebuild Lazarus with FPC 3.3.1
        shell: powershell
        run: |
          $make = "C:\lazarus\fpc\3.2.2\bin\x86_64-win64\make.exe"

          Push-Location "C:\lazarus"

          & $make `
            clean all `
            FPC="$env:FPC331" `
            CPU_TARGET=x86_64 `
            OS_TARGET=win64 `
            LCL_PLATFORM=win32

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          Pop-Location

      - name: Build Magicmida x64
        shell: powershell
        run: |
          & "C:\lazarus\lazbuild.exe" `
            "Magicmida.lpi" `
            --build-mode=Win64 `
            --compiler="$env:FPC331"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload Magicmida
        uses: actions/upload-artifact@v4
        with:
          name: Magicmida-2026-x64
          path: |
            **/Magicmida.exe
          if-no-files-found: error
